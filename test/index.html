  <body>

        "array": [
          "Lorem",

          "dolor",

          {
            "id": 1,
            "title": "Lorem ipsum dolor",

      JsonTree.create(js, document.getElementById('tree'));
      JsonTree.create('foobar', document.getElementById('tree'));
